[project]
name = "hw1"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["command", "interpreter", "parser", "sentence", "stream", "utils"]

[tool.pyright]
pythonVersion = "3.13"
include = ["."]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"
